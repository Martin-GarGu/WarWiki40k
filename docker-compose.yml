
services:
  app-backend:
    container_name: backend
    build:
      context: .
      dockerfile: back.dockerfile
    ports:
      - "8000:80"
    restart: always
    depends_on:
      - db
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: pruebas_proyecto
      DB_USERNAME: root
      DB_PASSWORD: root

  app-frontend:
    container_name: frontend
    build:
      context: .
      dockerfile: front.dockerfile
    ports:
      - "80:80"
    depends_on:
      - app-backend
    restart: always

  db:
    container_name: db
    image: mysql:5.7
    ports:
      - "3306:3306"
    restart: always
    environment:
      MYSQL_DATABASE: pruebas_proyecto
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - dbdata:/var/lib/mysql
volumes:
  dbdata: