version: '3'

services:
  app-backend:
    container_name: backend
    build: 
      context: .
      dockerfile: back.dockerfile
    ports:
      - "8000:80"
    restart: always
  
  app-frontend:
    container_name: frontend
    build: 
      context: .
      dockerfile: front.dockerfile
    ports:
      - "80:80"
    depends_on:
      - app-backend
    restart: always
    